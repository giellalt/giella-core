theme: jekyll-theme-giellalt

title: giella-core
description: Core tools and resources for the GiellaLT infrastructure

# repository: fallback for jekyll-github-metadata when PAGES_REPO_NWO isn't
# set (e.g. a local build run with JEKYLL_ENV=production, which skips its
# git-origin-remote autodetection).
repository: giellalt/giella-core

defaults:
  - scope: { path: "" }
    values:
      layout: default

markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true
